<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NDB SMS Services — Monitor</title>
<style>
  :root {
    --bg:#0f1419; --card:#1a2029; --card2:#131922; --line:#2a333f; --fg:#e6edf3; --muted:#8b949e;
    --ok:#2ea043; --warn:#d29922; --crit:#f85149; --unknown:#6e7681; --edge:#8957e5; --internal:#1f6feb;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg);padding:24px 16px}
  header{max-width:1100px;margin:0 auto 18px;display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px}
  h1{font-size:20px;margin:0}
  .meta{color:var(--muted);font-size:13px}
  .grid{max-width:1100px;margin:0 auto;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h2{font-size:16px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
  .sub{color:var(--muted);font-size:12px;margin:0 0 12px}
  .badge{font-size:10px;font-weight:700;letter-spacing:.5px;padding:2px 8px;border-radius:6px;text-transform:uppercase}
  .b-edge{background:var(--edge);color:#fff}.b-internal{background:var(--internal);color:#fff}
  .sec{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  .sec h3{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:0 0 6px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:13px}
  .k{color:var(--muted)}.v{text-align:right;word-break:break-word}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
  .s-ok{background:var(--ok)}.s-warning{background:var(--warn)}
  .s-critical,.s-expired,.s-down,.s-unreachable{background:var(--crit)}
  .s-unknown,.s-skipped,.s-degraded{background:var(--unknown)}
  .pill.s-ok{color:#fff}.pill.s-warning{color:#000}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
  th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600}
  td.days{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  .tag{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
  .err{color:var(--crit);font-size:12px}
  .hint{margin-top:10px;font-size:11px;color:var(--muted);background:var(--card2);border:1px dashed var(--line);border-radius:8px;padding:8px 10px}
  code{background:#0b0f14;padding:1px 5px;border-radius:4px;font-size:11px}
  footer{max-width:1100px;margin:20px auto 0;color:var(--muted);font-size:12px;text-align:center}
  button{background:#21262d;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px}
  button:hover{border-color:#4a5568}
</style>
</head>
<body>
  <header>
    <h1>NDB SMS Services — Monitor</h1>
    <div class="meta"><span id="updated">loading…</span>&nbsp;<button id="refresh">Refresh now</button></div>
  </header>
  <div class="grid" id="grid"></div>
  <footer id="footer"></footer>

<script>
const LABEL={ok:'Valid',warning:'Expiring soon',critical:'Expiring — act now',expired:'EXPIRED',unreachable:'Unreachable',unknown:'Unknown',up:'Up',down:'Down',degraded:'Degraded',skipped:'Not checked'};
const label=s=>LABEL[s]||s;
const pill=s=>`<span class="pill s-${s}">${label(s)}</span>`;
const dot=s=>`<span class="dot s-${s}"></span>`;
const row=(k,v)=>`<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`;
function certStatus(d,w,c){if(d==null)return 'unknown';if(d<0)return 'expired';if(d<=c)return 'critical';if(d<=w)return 'warning';return 'ok';}

function certBlock(title,c){
  if(!c) return '';
  if(!c.reachable) return `<div class="sec"><h3>${title}</h3>${row('Status',pill(c.status||'unreachable'))}${c.error?row('Error',`<span class="err">${c.error}</span>`):''}</div>`;
  let h=`<div class="sec"><h3>${title}</h3>`;
  h+=row('Status',pill(c.status));
  h+=row('CN',c.subject||'—');
  h+=row('Issuer',c.issuer||'—');
  h+=row('Expires',`${c.validTo||'—'} <b>(${c.daysRemaining==null?'—':c.daysRemaining+'d'})</b>`);
  h+=row('Chain trusted',c.authorized?'✅ yes':`❌ no${c.authorizationError?' — '+c.authorizationError:''}`);
  h+='</div>';
  return h;
}

function truststoreBlock(ts,w,c){
  if(!ts) return '';
  if(ts.error) return `<div class="sec"><h3>JKS Truststore</h3>${row(ts.file||'truststore',pill('unknown'))}${row('Error',`<span class="err">${ts.error}</span>`)}</div>`;
  const rows=ts.entries.map(e=>{
    const s=e.error?'unknown':certStatus(e.daysRemaining,w,c);
    return `<tr><td>${dot(s)} ${e.alias}</td><td><span class="tag">${e.type==='privateKeyEntry'?'key':'trusted'}</span></td><td>${e.cn||'—'}</td><td class="days">${e.error?'—':e.daysRemaining+'d'}</td></tr>`;
  }).join('');
  return `<div class="sec"><h3>JKS Truststore — ${ts.file} ${pill(ts.status)}</h3>
    <table><thead><tr><th>Alias</th><th>Type</th><th>CN</th><th>Days</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="hint"><b>Update a cert (no image rebuild):</b> replace the mounted JKS file, then restart — ECS: <code>--force-new-deployment</code>, K8s: <code>kubectl rollout restart</code>. This table refreshes and should turn green. See docs/03-RUNBOOK-cert-rotation.md.</div>
  </div>`;
}

function healthRow(h){
  if(!h) return row('Service health','—');
  let x='';
  if(h.httpStatus) x=` (HTTP ${h.httpStatus}, ${h.latencyMs}ms)`;
  else if(h.latencyMs!=null) x=` (${h.latencyMs}ms)`;
  if(h.error) x=` <span class="err">${h.error}</span>`;
  return row('Service health',pill(h.status)+x);
}

function worst(t){
  const order=['expired','down','unreachable','critical','degraded','warning','unknown','skipped','ok','up'];
  const vals=[t.cert&&t.cert.status,t.health&&t.health.status,t.truststore&&t.truststore.status,t.upstream&&t.upstream.cert&&t.upstream.cert.status].filter(Boolean);
  for(const s of order) if(vals.includes(s)) return s;
  return 'unknown';
}

async function load(fresh){
  document.getElementById('updated').textContent='refreshing…';
  try{
    // Static preview mode: render embedded data instead of calling the API.
    const data = window.__previewData
      ? window.__previewData
      : await (await fetch('/api/status'+(fresh?'?fresh=1':''))).json();
    const w=data.warnDays,c=data.criticalDays;
    document.getElementById('grid').innerHTML=(data.targets||[]).map(t=>`
      <div class="card">
        <h2>${dot(worst(t))} ${t.name}
          <span class="badge b-${t.role==='edge'?'edge':'internal'}">${t.role==='edge'?'Edge':'Internal'}</span></h2>
        <p class="sub">${t.platform||''} · ${t.host}:${t.port}</p>
        ${healthRow(t.health)}
        ${certBlock('Served TLS cert (what clients see)',t.cert)}
        ${t.upstream?certBlock('Upstream: '+t.upstream.name+' (must be trusted)',t.upstream.cert):''}
        ${truststoreBlock(t.truststore,w,c)}
      </div>`).join('');
    document.getElementById('updated').textContent='Updated '+new Date(data.generatedAt).toLocaleString()+(data.profile&&data.profile!=='all'?' · profile: '+data.profile:'');
    document.getElementById('footer').textContent=`warn < ${w}d · critical < ${c}d · config: ${data.config?data.config.source:'?'} · auto-refresh ${data.config?data.config.refreshSeconds:'?'}s`;
    if(!window.__previewData && data.config&&data.config.refreshSeconds){clearTimeout(window.__t);window.__t=setTimeout(()=>load(false),data.config.refreshSeconds*1000);}
  }catch(e){document.getElementById('updated').textContent='error loading status';}
}
document.getElementById('refresh').addEventListener('click',()=>load(true));
load(false);
</script>
</body>
</html>
