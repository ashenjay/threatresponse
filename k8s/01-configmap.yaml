apiVersion: v1
kind: ConfigMap
metadata:
  name: sms-monitor-config
  namespace: sms-monitor
data:
  # Mounted at /app/config.json (see deployment). No secrets here —
  # only hostnames, ports and optional cert file paths.
  # >>> REPLACE the UAT hosts with production hosts when you promote. <<<
  config.json: |
    {
      "refreshSeconds": 300,
      "warnDays": 30,
      "criticalDays": 7,
      "alert": { "enabled": false, "throttleHours": 12 },
      "targets": [
        {
          "name": "SMSGateway (AWS / ECS)",
          "host": "ndbsms-uat.ndblk.int",
          "port": 443,
          "servername": "ndbsms-uat.ndblk.int",
          "health": { "type": "https", "port": 443, "path": "/SMSGateway/actuator/health" },
          "bundledCerts": []
        },
        {
          "name": "NDBSMSRouter (K8s / TKG)",
          "host": "ndbsmsrouter.ndblk.int",
          "port": 8085,
          "servername": "ndbsmsrouter.ndblk.int",
          "health": { "type": "http", "port": 8085, "path": "/actuator/health" },
          "bundledCerts": []
        }
      ]
    }
