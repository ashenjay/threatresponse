# EXAMPLE ONLY — do NOT commit a real secret. Copy to 02-secret.yaml, fill in,
# and apply separately (02-secret.yaml is git-ignored).
#
# Only needed if you enable email alerts (alert.enabled=true in the ConfigMap).
apiVersion: v1
kind: Secret
metadata:
  name: sms-monitor-smtp
  namespace: sms-monitor
type: Opaque
stringData:
  SMTP_HOST: "smtp.ndblk.int"
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_USER: "sms-monitor@ndbbank.com"
  SMTP_PASS: "REPLACE-ME"
  ALERT_FROM: "sms-monitor@ndbbank.com"
  ALERT_TO: "it-ops@ndbbank.com"
